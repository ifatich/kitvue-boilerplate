<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#004d43" />
    <title>SPRINT POS — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      const params = new URLSearchParams(window.location.search)
      const redirectPath = params.get('p')

      if (redirectPath) {
        const path = window.location.pathname.replace(/\/$/, '') +
          (redirectPath.startsWith('/') ? redirectPath : `/${redirectPath}`).replace(/~and~/g, '&')
        const query = params.get('q')?.replace(/~and~/g, '&')
        window.history.replaceState(null, '', `${path}${query ? `?${query}` : ''}${window.location.hash}`)
      }
    </script>
  </head>
  <body>
    <div id="pos-app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
