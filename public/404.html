<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      const l = window.location;
      const segments = l.pathname.split('/').filter(Boolean);
      const isPos = segments[1] === 'POS';
      const appBase = '/' + segments[0] + (isPos ? '/POS/' : '/');
      const route = segments.slice(isPos ? 2 : 1).join('/').replace(/&/g, '~and~');
      const query = l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '';

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        appBase + '?p=/' + route + query + l.hash
      );
    </script>
  </head>
  <body></body>
</html>
