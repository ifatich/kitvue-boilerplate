name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Type check (TypeScript)
        run: pnpm type-check

      - name: Run unit tests
        run: pnpm test

      - name: Build application
        run: pnpm build
        env:
          VITE_BASE_PATH: /kitvue-boilerplate/

      - name: Build SPRINT POS
        run: pnpm pos:build
        env:
          VITE_POS_BASE_PATH: /kitvue-boilerplate/POS/

      - name: Add SPRINT POS to Pages artifact
        run: |
          mkdir -p ./dist/POS
          cp -R ./POS/dist/. ./dist/POS/

      - name: Configure SPA deep links for GitHub Pages
        run: cp ./dist/index.html ./dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
