<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitvue Starter Template - Bullion Bank & Pegadaian</title>
    <script>
      const params = new URLSearchParams(window.location.search)
      const redirectPath = params.get('p')

      if (redirectPath) {
        const path = window.location.pathname.replace(/\/$/, '') +
          (redirectPath.startsWith('/') ? redirectPath : `/${redirectPath}`).replace(/~and~/g, '&')
        const query = params.get('q')?.replace(/~and~/g, '&')
        window.history.replaceState(null, '', `${path}${query ? `?${query}` : ''}${window.location.hash}`)
      }
    </script>
    <!-- Google Fonts: Nunito Sans (Standard Pegadaian UI Kit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300;0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;0,6..12,900;1,6..12,400;1,6..12,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
